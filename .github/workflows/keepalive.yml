# Mantiene activo el proyecto de Supabase (plan gratis: se pausa tras 7 días sin uso).
# GitHub ejecuta esto solo, cada 3 días, aunque nadie abra la app.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 */3 * *'   # cada 3 días, 9:17 hora argentina
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Avisarle a Supabase que la app sigue en uso
        run: |
          curl -fsS -X POST "https://inisrnsrloebstglhybf.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_X4VOeQjmn3zakkAshx1O9g_m44QTPcn" \
            -H "Content-Type: application/json" -d '{}'

      # GitHub apaga las tareas automáticas si el repo pasa 60 días sin cambios.
      # Una vez por mes deja una marca de actividad para que eso no pase.
      - uses: actions/checkout@v4
      - name: Registrar actividad mensual
        run: |
          if [ "$(date -u +%d)" -le 03 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive mensual" && git push || true
          fi
